name: Automatic Google Sheet Backup

on:
  schedule:
    # Runs automatically every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch: # Enables a manual trigger button in GitHub Actions

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Sheet CSV
        run: |
          curl -L "https://docs.google.com/spreadsheets/d/1Ey6jeAc_H16xKjr0d8YyihVJMkc9CQwN_R9W9XUOHpU/export?format=csv" -o backup.csv

      - name: Commit and Push Updated Backup
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add backup.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update sheet backup [skip ci]" && git push)
